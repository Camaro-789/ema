<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Tipos - FiberMap Táchira</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="catalog.css">
</head>
<body>
    <div id="app">
        <header id="topbar">
            <div class="logo">
                <span class="icon">🗺️</span>
                <h1>FiberMap Táchira</h1>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Buscar...">
            </div>
            <div class="user-actions">
                <a href="/" class="btn-secondary">← Volver al mapa</a>
                <div class="avatar">AD</div>
            </div>
        </header>

        <div id="main-content">
            <aside id="sidebar" class="icon-sidebar">
                <div class="sidebar-rail">
                    <a href="/" class="nav-icon" title="Mapa">🏠</a>
                    <a href="/catalog" class="nav-icon active" title="Catálogo de Tipos">🔑</a>
                </div>
            </aside>

            <main id="catalog-main">
                <div class="catalog-header">
                    <h2>Catálogo de Tipos</h2>
                    <p>Define los tipos de cada categoría de infraestructura para luego seleccionarlos al agregar elementos en el mapa.</p>
                </div>

                <div class="catalog-controls">
                    <label for="categoria-select">Categoría</label>
                    <select id="categoria-select">
                        <option value="">-- Selecciona una categoría --</option>
                    </select>
                    <button id="btn-new-type" class="btn-primary" disabled>＋ Agregar tipo</button>
                </div>

                <div id="catalog-form-container" class="catalog-form-container hidden">
                    <form id="catalog-form" class="catalog-form">
                        <input type="hidden" id="tipo-id">
                        <div id="form-fields">
                            <input type="text" id="tipo-nombre" placeholder="Nombre del tipo" required>
                            <textarea id="tipo-descripcion" placeholder="Descripción" rows="2"></textarea>
                            <input type="text" id="tipo-foto-url" placeholder="URL de la foto (opcional)">
                            <div id="tipo-atributos-fields"></div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Guardar tipo</button>
                            <button type="button" id="btn-cancel-type" class="btn-secondary">Cancelar</button>
                        </div>
                    </form>
                </div>

                <div id="catalog-list-container">
                    <h3>Tipos de <span id="categoria-selected-name">--</span></h3>
                    <ul id="catalog-list" class="catalog-list"></ul>
                    <p id="catalog-empty" class="empty-state">Sin tipos. Haz clic en “＋ Agregar tipo” para crear el primero.</p>
                </div>
            </main>
        </div>
    </div>

    <script src="/static/js/catalog.js"></script>
</body>
</html>
